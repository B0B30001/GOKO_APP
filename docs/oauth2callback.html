<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGS OAuth Callback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Zaibal</h1>
        <div class="spinner"></div>
        <p>Completing login...</p>
        <p id="status">Please wait</p>
    </div>

    <script>
        // Get the authorization code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        
        const statusEl = document.getElementById('status');
        
        if (error) {
            statusEl.textContent = 'Login cancelled or failed';
            setTimeout(() => {
                window.close();
            }, 3000);
        } else if (code) {
            // Try to send code back to the app
            // For mobile apps, we need to use a custom URL scheme
            const appUrl = `zaibalgo://oauth2callback?code=${code}`;
            statusEl.textContent = 'Redirecting to app...';
            
            // Try to open the app
            window.location.href = appUrl;
            
            // Fallback: if app doesn't open in 2 seconds, show manual instructions
            setTimeout(() => {
                statusEl.innerHTML = 'App not installed?<br>Please copy this code:<br><strong>' + code + '</strong>';
            }, 2000);
        } else {
            statusEl.textContent = 'No authorization code received';
        }
    </script>
</body>
</html>
