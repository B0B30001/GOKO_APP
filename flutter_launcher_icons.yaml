# Generates the app launcher icon from the GOKO logo, replacing the default
# Flutter icon. Run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/goko_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0F1729"
  adaptive_icon_background: "#0F1729"
  adaptive_icon_foreground: "assets/logo/goko_logo.png"
