<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GOKO - Play, learn, and improve at Go (Baduk).">

  <!-- Cache busting: ensure mobile browsers always revalidate the entry HTML -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GOKO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GOKO</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // One-shot stale-cache eviction for users on old service-worker bundles.
    // Runs once per browser; flag is stored in localStorage so we don't keep
    // unregistering after the new bundle is in place.
    (function () {
      try {
        var EVICT_KEY = 'goko_sw_evicted_v1';
        if (localStorage.getItem(EVICT_KEY) === '1') return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          });
        }
        localStorage.setItem(EVICT_KEY, '1');
      } catch (e) { /* best effort */ }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
